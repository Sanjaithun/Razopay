<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Enterprise Checkout | RevRecover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                deep: '#111827',
                surface: '#1F2937',
                accent: '#4F46E5',
                accentHover: '#4338CA',
              }
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInLeft: {
                '0%': { transform: 'translateX(-20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              pulseSlow: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.4' },
              }
            },
            animation: {
              fadeInUp: 'fadeInUp 0.5s ease-out forwards',
              slideInLeft: 'slideInLeft 0.4s ease-out forwards',
              pulseSlow: 'pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      * { transition: all 0.2s ease-in-out; }
      .animate-on-load { opacity: 0; }
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
    </style>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-[#F8FAFC] text-slate-900 font-sans min-h-screen">
    
    <nav class="bg-white border-b border-slate-100 px-8 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-brand-accent rounded-full grid place-content-center text-white font-bold text-xs">R</div>
            <h1 class="text-lg font-bold text-slate-900">Rev<span class="text-brand-accent">Recover</span></h1>
        </div>
        <a href="dashboard.html" class="text-sm font-semibold text-slate-600 hover:text-brand-accent flex items-center gap-1 group">
            Merchant Console 
            <span class="group-hover:translate-x-1 transition-transform">→</span>
        </a>
    </nav>

    <main class="max-w-5xl mx-auto py-16 px-4">
        <div class="bg-white rounded-3xl shadow-lg shadow-slate-100 border border-slate-100 p-10 grid grid-cols-1 md:grid-cols-[1.5fr,1fr] gap-12 animate-fadeInUp">
            
            <!-- Left Side: Summary -->
            <div class="animate-fadeInUp delay-100">
                <div class="flex items-center gap-2 mb-2">
                    <span class="px-2 py-0.5 bg-indigo-50 text-brand-accent text-xs font-bold rounded-full">Annual Plan</span>
                </div>
                <h2 class="text-3xl font-extrabold mb-5 tracking-tight text-slate-950">Enterprise Pro License</h2>
                
                <div class="border-y border-slate-100 py-6 my-6 space-y-3">
                    <div class="flex justify-between items-center font-medium">
                        <span class="text-slate-600">Base Subscription</span>
                        <span class="text-slate-950 text-lg">₹4,236.44</span>
                    </div>
                    <div class="flex justify-between items-center font-medium">
                        <span class="text-slate-600">Tax (GST 18%)</span>
                        <span class="text-slate-950 text-lg">₹762.56</span>
                    </div>
                </div>

                <div class="flex justify-between items-end font-bold text-xl">
                    <span class="text-slate-950">Total Amount Due</span>
                    <span class="text-4xl font-extrabold text-brand-accent tracking-tighter">₹4,999.00</span>
                </div>
                <p class="text-xs text-slate-400 mt-2">Annual billing. Cancel anytime. Secured by Razorpay.</p>
            </div>

            <!-- Right Side: Details & Action -->
            <div class="bg-slate-50 p-8 rounded-2xl border border-slate-100 space-y-5 animate-fadeInUp delay-200">
                <h3 class="text-xl font-bold mb-3 text-slate-950">Customer Information</h3>
                
                <div class="space-y-1">
                    <label for="cust-name" class="text-xs font-semibold text-slate-500">Full Name</label>
                    <input type="text" id="cust-name" placeholder="Enter Full Name" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-accent/20 focus:border-brand-accent outline-none hover:border-slate-300">
                </div>
                
                <div class="space-y-1">
                    <label for="cust-email" class="text-xs font-semibold text-slate-500">Email Address</label>
                    <input type="email" id="cust-email" placeholder="Enter email address" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-accent/20 focus:border-brand-accent outline-none hover:border-slate-300">
                </div>
                
                <div class="pt-4">
                    <button id="pay-btn" class="w-full bg-brand-deep hover:bg-slate-950 text-white font-semibold py-4 rounded-xl shadow-lg transition-transform active:scale-[0.98]">
                        Complete Secure Payment
                    </button>
                    <div id="payment-status" class="text-center mt-3 text-sm hidden animate-fadeInUp"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/checkout.js"></script>
</body>
</html>
